<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fashion Stylist Assistant</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">&#10022;</span>
        <div class="brand-text">
          <h1>Fashion Stylist</h1>
          <p class="brand-sub">Real catalog. Real prices. No guessing.</p>
        </div>
      </div>
      <button id="new-session-btn" title="Start a new conversation">New chat</button>
    </header>

    <main id="chat-window" class="chat-window" aria-live="polite">
      <div class="message assistant">
        <div class="bubble">
          Hi! Tell me what you're shopping for - an occasion, a budget, colours
          to avoid - and I'll search the catalog for you.
        </div>
      </div>
    </main>

    <form id="chat-form" class="chat-form">
      <input
        id="chat-input"
        type="text"
        autocomplete="off"
        placeholder="e.g. something for an outdoor September wedding, under $200"
        aria-label="Message"
      />
      <button type="submit" id="send-btn">Send</button>
    </form>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
