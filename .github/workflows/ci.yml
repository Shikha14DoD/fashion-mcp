name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *" # nightly full eval against the live deploy

permissions:
  contents: read

jobs:
  frontend:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-next/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  backend-deterministic:
    # Calls server.py's tool functions straight against the database: no LLM,
    # no running server, same result every run - safe to gate every push on.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check DATABASE_URL secret is set
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Repository secret DATABASE_URL is not set (Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - run: python eval_harness.py --suite deterministic

  llm-eval:
    # Drives the deployed agent end to end. Kept off the per-push path: back to
    # back LLM calls trip Groq's 8000 tokens/minute free-tier limit, which would
    # make every push flaky. Runs nightly and on demand instead.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Wake the Render backend (free tier cold start)
        run: curl -s -m 120 -X POST https://fashion-mcp-backend.onrender.com/session || true
      - run: python eval_harness.py --base-url https://fashion-mcp-backend.onrender.com
